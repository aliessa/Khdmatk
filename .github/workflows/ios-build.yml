name: Build iOS App & Simulator

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build for iOS Simulator (No Mac or Paid Account Needed)
        run: |
          xcodebuild build \
            -project Khdmatk.xcodeproj \
            -scheme Khdmatk \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate & Compress Simulator App
        run: |
          mkdir -p output
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "Khdmatk.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            echo "Found App at $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/output/Khdmatk-Simulator.app.zip" "Khdmatk.app"
          else
            echo "App not found!"
            exit 1
          fi

      - name: Upload Simulator Build Artifact (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: Khdmatk-Simulator-Build
          path: output/Khdmatk-Simulator.app.zip
          retention-days: 14
