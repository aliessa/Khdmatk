name: Build iOS App (IPA & Simulator)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA & Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 1. Build and package actual .ipa
      - name: Build and Package iOS .IPA
        run: |
          mkdir -p build_output
          xcodebuild archive \
            -project Khdmatk.xcodeproj \
            -scheme Khdmatk \
            -configuration Release \
            -archivePath build_output/Khdmatk.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r "build_output/Khdmatk.xcarchive/Products/Applications/Khdmatk.app" Payload/
          zip -r "build_output/Khdmatk.ipa" Payload
          rm -rf Payload

      # 2. Build Simulator version
      - name: Build Simulator App
        run: |
          xcodebuild build \
            -project Khdmatk.xcodeproj \
            -scheme Khdmatk \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath sim_build \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find sim_build/Build/Products/Debug-iphonesimulator -name "Khdmatk.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/build_output/Khdmatk-Simulator.app.zip" "Khdmatk.app"
          fi

      # 3. Upload Artifacts
      - name: Upload Khdmatk.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khdmatk-iOS-IPA
          path: build_output/Khdmatk.ipa
          retention-days: 30

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khdmatk-Simulator-Build
          path: build_output/Khdmatk-Simulator.app.zip
          retention-days: 30

      # 4. Create Public Release with Direct Download Links
      - name: Release Khdmatk.ipa on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Khdmatk iOS App v1.0.0"
          draft: false
          prerelease: false
          files: |
            build_output/Khdmatk.ipa
            build_output/Khdmatk-Simulator.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
